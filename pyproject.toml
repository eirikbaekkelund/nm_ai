[project]
name = "nm-ai"
version = "0.1.0"
description = "NM AI project"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision",
    "timm",
    "pytorch-metric-learning",
    "ultralytics",
    "rembg",
    "opencv-python",
    "scikit-learn",
    "pandas",
    "matplotlib",
    "wandb",
    "webdataset",
    "umap-learn",
    "seaborn",
    "albumentations",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vision_task*"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"

[tool.black]
line-length = 120
skip-string-normalization = true

[tool.isort]
line_length = 79
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pycln]
all = true
exclude = "__init__.py"